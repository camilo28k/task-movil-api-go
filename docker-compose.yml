services:
  postgres:
    image: postgres:16
    container_name: crud_postgres_go
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crud_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crud_net

  task-movil-api-go:
    build: .
    container_name: task-movil-api-go
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy  # espera a que postgres esté listo
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: crud_db
      DB_PORT: 5432
    networks:
      - crud_net


